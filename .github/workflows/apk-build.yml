name: Build Cloud Phone APK

# Same pattern as zen-panel hub-apk.yml: auto-build on push,
# git-based versioning, sideload keystore, GitHub Release.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/apk-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Version from git
        run: |
          CODE=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_SHA=$SHA" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.$CODE.$SHA" >> "$GITHUB_ENV"
          echo "TAG=cp-v1.$CODE" >> "$GITHUB_ENV"
          echo "version 1.$CODE.$SHA (code $CODE)"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      # Do not use `secrets.*` in `if:` — GitHub rejects the whole workflow.
      - name: Optional release keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p android/app/keystore
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore/upload.jks
            echo "using ANDROID_KEYSTORE_BASE64"
          else
            echo "using bundled android/app/keystore/upload.jks"
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ( cd android &&
            /opt/gradle-8.9/bin/gradle wrapper --gradle-version 8.9 --no-daemon &&
            ./gradlew :app:assembleRelease --no-daemon --stacktrace ) 2>&1 | tee /tmp/gradle-cp-build.log
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if command -v apksigner >/dev/null; then apksigner verify --print-certs "$APK" || true
          else echo "apksigner not on PATH (ok)"; fi

      - name: Package APK
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$SRC"
          NAME="cloud-phone-${VERSION_NAME}.apk"
          cp "$SRC" "$NAME"
          echo "APK_FILE=$NAME" >> "$GITHUB_ENV"
          ls -lh "$NAME"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cloud-phone-apk
          path: cloud-phone-*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cloud-phone-build-log, path: /tmp/gradle-cp-build.log, if-no-files-found: warn }

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Cloud Phone ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ env.APK_FILE }}
          body: |
            Автосборка Cloud Phone APK.

            | | |
            |---|---|
            | версия | ${{ env.VERSION_NAME }} |
            | подпись | zen-panel sideload upload key |
            | коммит | ${{ github.sha }} |